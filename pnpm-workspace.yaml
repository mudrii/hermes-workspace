  nanoid: ^5.1.7
  extract-zip: ^2.0.1
  electron: ^40.8.2
  dompurify: ^3.4.17
  '@babel/core': ^7.29.13
  baseline-browser-mapping: ^2.11.35
  browserslist: ^4.29.5
  builder-util-runtime: ^9.7.0
  colord: ^2.10.0
  decode-uri-component: ^0.5.1
  fflate: ^0.8.3
  katex: ^0.18.2
  mermaid: ^11.16.1
  source-map-js: ^1.2.2
  'yaml@^1.0.0': ^1.10.3
